<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday</title>
  <link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Gloria Hallelujah', cursive;
      position: relative;
    }

    .hover-container {
      position: relative;
      display: inline-block;
    }

    .main-image {
      width: 650px; /* Main buttons image */
      display: block;
      border-radius: 12px;
      cursor: pointer;
    }

    /* Left and Right buttons centered on the sides of the main image */
    .hover-button {
      width: 100px; /* Smaller button images for sound */
      height: 100px;
      position: absolute;
      top: 50%;
      transform: translateY(-50%); /* Center vertically */
      cursor: pointer;
      z-index: 2;
      transition: transform 0.3s ease;
    }

    .left-button {
      left: -120px; /* Position to the left of the main image */
    }

    .right-button {
      right: -120px; /* Position to the right of the main image */
    }

    .hover-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 40px; /* Larger text */
      font-weight: bold;
      color: #45b6fe;
      text-align: center;
      pointer-events: none;
      line-height: 1.4;
      max-width: 90%;
      text-shadow: 2px 2px 6px white;
      -webkit-mask-image: radial-gradient(circle 200px at var(--x, 50%) var(--y, 50%), rgba(0,0,0,1) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
      mask-image: radial-gradient(circle 200px at var(--x, 50%) var(--y, 50%), rgba(0,0,0,1) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-size: 350px 350px;
      mask-size: 350px 350px;
      transition: mask-image 0.2s ease, -webkit-mask-image 0.2s ease;
    }

    .hover-button:hover {
      transform: scale(1.1); /* Slight zoom effect on hover */
    }
  </style>
</head>
<body>

  <div class="hover-container" id="hoverBox">
    <!-- Main background image (buttons.png) -->
    <img src="buttons.png" alt="Hover to reveal" class="main-image" id="mainImage">
    
    <!-- Hover text reveal -->
    <div class="hover-text" id="hoverText">🎉 Happy Birthday Aspect AKA Ayan 🎉</div>

    <!-- Left button for song 1 -->
    <img src="song1.jpeg" alt="Play Song 1" class="hover-button left-button" id="leftButton">
    <audio id="hoverSound1" src="song1.mp3" preload="auto"></audio>

    <!-- Right button for song 2 -->
    <img src="song2.png" alt="Play Song 2" class="hover-button right-button" id="rightButton">
    <audio id="hoverSound2" src="song2.mp3" preload="auto"></audio>
  </div>

  <script>
    // Hover effect for text reveal
    const hoverBox = document.getElementById('hoverBox');
    const hoverText = document.getElementById('hoverText');

    hoverBox.addEventListener('mousemove', (e) => {
      const rect = hoverBox.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      hoverText.style.setProperty('--x', `${x}px`);
      hoverText.style.setProperty('--y', `${y}px`);
    });

    // Play song 1 on left button hover
    const leftButton = document.getElementById('leftButton');
    const hoverSound1 = document.getElementById('hoverSound1');

    leftButton.addEventListener('mouseenter', () => {
      hoverSound1.currentTime = 0; // Start from beginning
      hoverSound1.play();
    });

    leftButton.addEventListener('mouseleave', () => {
      hoverSound1.pause();
      hoverSound1.currentTime = 0; // Reset when mouse leaves
    });

    // Play song 2 on right button hover
    const rightButton = document.getElementById('rightButton');
    const hoverSound2 = document.getElementById('hoverSound2');

    rightButton.addEventListener('mouseenter', () => {
      hoverSound2.currentTime = 0; // Start from beginning
      hoverSound2.play();
    });

    rightButton.addEventListener('mouseleave', () => {
      hoverSound2.pause();
      hoverSound2.currentTime = 0; // Reset when mouse leaves
    });
  </script>

</body>
</html>
