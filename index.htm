<!DOCTYPE html>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      font-family: 'Cherry Bomb One', cursive;
      background-image: url('hello1.jpg');
