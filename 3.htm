<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letter</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #f5d0df;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .header-text {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      color: #ff69b4;
      margin-right: 10px;
      text-align: center;
    }

    .hello-link {
      width: 50px;
      flex-shrink: 0;
    }

    .hello-link img {
      width: 100%;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .hello-link img:hover {
      transform: scale(1.1);
    }

    .a4-wrapper {
      position: relative;
      height: 80vh;
      aspect-ratio: 1 / 1.41;
      background-color: white;
      overflow: hidden;
    }

    .a4-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Hidden audio element -->
<audio id="bg-music">
    <source src="ok.mp3" type="audio/mpeg">
  </audio>
  
  <script>
    // Function to play music
    function playMusicOnMouseMove() {
      const audio = document.getElementById("bg-music");
  
      // Try playing the audio
      audio.play().then(() => {
        console.log("Music started!");
      }).catch((e) => {
        console.warn("Autoplay blocked:", e);
      });
  
      // Remove listener after first movement
      window.removeEventListener("mousemove", playMusicOnMouseMove);
    }
  
    // Listen for mouse movement once
    window.addEventListener("mousemove", playMusicOnMouseMove);
  </script>

  <!-- Header with sentence and Hello Kitty link beside it -->
  <div class="header">
    <div class="header-text">Click the Hello Kitty after you're done reading it ^-^</div>
    <a href="4.htm" class="hello-link">
      <img src="buttonss.png" alt="Click to Continue" />
    </a>
  </div>

  <!-- A4 content -->
  <div class="a4-wrapper">
    <img src="A4.jpg" alt="A4 Page" class="a4-image" />
  </div>

  <!-- Autoplay script -->
  <script>
    window.addEventListener('load', () => {
      const audio = document.getElementById('bg-music');
      audio.play().catch(e => {
        console.warn('Autoplay was blocked:', e);
      });
    });
  </script>

</body>
</html>
